<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>XAcademy</title>
    </head>    
    <body>         
        <h1>Formularios</h1>
        <form action="https://servidor.web.com/guardarDatos" method="post">
            
            <p>
                <label for="texto">Texto</label>
                <input type="text" value="valor inicial" name="texto" id="texto"/>
            </p>
            
            <p>
                <label for="edad"> Numero</label>
                <input type="number" placeholder="Este es un numero" name="edad"/>
            </p>

            <p>
                <label>Email</label>
                <input type="email" name="email"/>   
            </p>
            
            <p>
                <label>Password</label>
                <input type="password" name="password"/>
            </p>  
              
            <p>
                <label>Fecha</label>
                <input type="date" name="fecha-de-nacimiento"/>
            </p>
            <p>
                <label>Descripcion</label>
                <textarea name="descripcion" id="descripcion">esto es una descripcion</textarea>
            </p>

        </form>
    </body>
</html>
